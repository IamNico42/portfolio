site_name: Nico's Knowledge Base
site_url: https://IamNico42.github.io/portfolio/

theme:
  name: material
  custom_dir: overrides
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: indigo
      toggle:
        icon: material/sunglasses
        name: Zieh deine Sonnenbrille auf - switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: dark-blue
      toggle:
        icon: fontawesome/solid/blind
        name: Werde blind - switch to light mode
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - navigation.indexes
    #- navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow

# Extensions
markdown_extensions:
  - md_in_html
  - attr_list
  - pymdownx.superfences
  - pymdownx.emoji:              # Icons in den Karten der Startseite
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - nl2br
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - def_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true




plugins:
  - search
  - roamlinks
  - callouts
  - meta-descriptions


extra_css:
  - stylesheets/styles.css
  - stylesheets/home.css
  - stylesheets/projects.css
  - stylesheets/contact.css


extra:
  generator: false



extra_javascript:
  - javascripts/home.js 
  - javascripts/neural-bg.js
  - javascripts/contact.js
  - javascripts/mathjax.js

  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js 
